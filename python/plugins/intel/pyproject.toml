[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lego-layout-intel"
version = "0.2.2"
description = "Intel GPU (SPIRV/XeVM) backend plugin for lego-layout"
requires-python = ">=3.12"
dependencies = ["lego-layout>=0.2.2"]

[project.entry-points."lego.backends"]
intel = "lego_intel:register"

[tool.setuptools.packages.find]
include = ["lego_intel", "lego_intel.*"]
