[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lego-layout"
version = "0.1.4"
description = "LEGO: Layout Expression Language for Code Generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["sympy", "numpy"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Compilers",
    "Topic :: System :: Hardware",
]

[project.optional-dependencies]
spirv = []  # naga binary is bundled; no extra Python deps needed

[tool.pytest.ini_options]
filterwarnings = [
    # Numba small-grid performance warnings (expected for small test sizes)
    "ignore:Grid size \\d+ will likely result in GPU under-utilization::numba",
    # PyTorch torch.jit.script_method deprecation (internal PyTorch, not our code)
    "ignore:`torch.jit.script_method` is deprecated:DeprecationWarning",
]

[tool.setuptools.packages.find]
include = ["mlir", "mlir.*", "lego", "lego.*"]

[tool.setuptools.package-data]
"lego.bin" = ["*"]
