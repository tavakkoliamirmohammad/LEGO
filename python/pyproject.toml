[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lego"
version = "0.1.0"
description = "LEGO: A library for compiling MLIR/Triton kernels via Layout Expressions"
authors = [
    { name = "LEGO Authors" }
]
requires-python = ">=3.8"
dependencies = [
    "sympy",
    "jinja2"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[tool.setuptools]
packages = ["lego"]
