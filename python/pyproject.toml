[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lego-layout"
version = "0.2.2"
description = "LEGO: Layout Expression Language for Code Generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["sympy", "numpy"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Compilers",
    "Topic :: System :: Hardware",
]

[project.optional-dependencies]
cuda = ["lego-layout-cuda>=0.2.2"]
rocm = ["lego-layout-rocm>=0.2.2"]
intel = ["lego-layout-intel>=0.2.2"]
all = [
    "lego-layout-cuda>=0.2.2",
    "lego-layout-rocm>=0.2.2",
    "lego-layout-intel>=0.2.2",
]

[tool.pytest.ini_options]
filterwarnings = [
    # Numba small-grid performance warnings (expected for small test sizes)
    "ignore:Grid size \\d+ will likely result in GPU under-utilization::numba",
    # PyTorch torch.jit.script_method deprecation (internal PyTorch, not our code)
    "ignore:`torch.jit.script_method` is deprecated:DeprecationWarning",
]

[tool.setuptools.packages.find]
include = ["lego", "lego.*"]

# package_data is handled dynamically by setup_wheel.py (discovers .so files)
