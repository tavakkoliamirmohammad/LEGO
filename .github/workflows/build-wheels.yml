name: Build Python Wheels

on:
  push:
    branches: [test_pip_package]
  workflow_dispatch:       # Manual trigger

jobs:
  build-wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.11"
          - os: ubuntu-22.04
            python: "3.12"
          - os: ubuntu-22.04
            python: "3.13"
          # Uncomment when ready:
          # - os: macos-14        # Apple Silicon
          #   python: "3.12"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Python dependencies
        run: pip install nanobind sympy

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build lld ccache

      # --- ccache for C/C++ compilation ---
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: llvm-${{ matrix.os }}-py${{ matrix.python }}
          max-size: 2G

      # --- CMake build directory cache ---
      # Cache the LLVM/MLIR build objects. The key is pinned to the
      # llvm-project submodule commit so it auto-invalidates when you
      # update LLVM.
      - name: Get LLVM submodule commit
        id: llvm-rev
        run: |
          echo "sha=$(git submodule status third_party/llvm-project | awk '{print $1}' | tr -d '-+')" >> "$GITHUB_OUTPUT"

      - name: Cache LLVM build
        uses: actions/cache@v4
        with:
          path: |
            build/llvm-build
          key: llvm-build-${{ matrix.os }}-py${{ matrix.python }}-${{ steps.llvm-rev.outputs.sha }}
          restore-keys: |
            llvm-build-${{ matrix.os }}-py${{ matrix.python }}-

      - name: Configure CMake
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLEGO_MONOLITHIC_LLVM=ON \
            -DLEGO_LLVM_TARGETS="X86;NVPTX" \
            -DMLIR_ENABLE_BINDINGS_PYTHON=ON \
            -DLEGO_BUILD_TESTS=OFF \
            -DLLVM_USE_LINKER=lld

      - name: Build Python bindings
        run: cmake --build build --target LegoPythonModules -j$(nproc)

      - name: Prepare wheel package
        run: |
          cd build/python_packages/lego

          # Resolve symlinks — wheel needs real files, not symlinks
          find . -type l | while read link; do
            target=$(readlink -f "$link")
            rm "$link"
            cp -a "$target" "$link"
          done

          # Generate pyproject.toml for the assembled package
          cat > pyproject.toml << 'PYPROJECT'
          [build-system]
          requires = ["setuptools>=61.0"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "lego-mlir"
          version = "0.1.0"
          description = "LEGO: Layout Expression Language for Code Generation"
          requires-python = ">=3.8"

          [tool.setuptools.packages.find]
          include = ["mlir*"]

          [tool.setuptools.package-data]
          "*" = ["*.so", "*.so.*", "*.dylib", "*.pyd", "*.h"]
          PYPROJECT

      - name: Build wheel
        run: |
          pip install build
          cd build/python_packages/lego
          python -m build --wheel --no-isolation

      - name: Verify wheel installs
        run: |
          pip install build/python_packages/lego/dist/*.whl
          python -c "from mlir.ir import Context; print('mlir.ir OK')"
          python -c "from mlir.lego.dialects.lego_dialect import register; print('lego dialect OK')"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: build/python_packages/lego/dist/*.whl

  # Optional: publish to PyPI on tagged releases
