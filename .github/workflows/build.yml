name: Build

on:
  push:
    branches: [test_pip_package]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
        python: ["3.12", "3.13"]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Python dependencies
        run: pip install nanobind sympy pytest

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build lld ccache

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: llvm-${{ matrix.os }}
          max-size: 2G

      - name: Get LLVM submodule commit
        id: llvm-rev
        run: |
          echo "sha=$(git submodule status third_party/llvm-project | awk '{print $1}' | tr -d '-+')" >> "$GITHUB_OUTPUT"

      # Cache the LLVM build directory. Key does NOT include Python version
      # so the first Python variant builds LLVM and the second gets a cache hit.
      # Ninja only rebuilds the Python-specific targets on cache hit.
      - name: Cache LLVM build
        uses: actions/cache@v4
        with:
          path: build/llvm-build
          key: llvm-build-v3-${{ matrix.os }}-${{ steps.llvm-rev.outputs.sha }}
          restore-keys: |
            llvm-build-v3-${{ matrix.os }}-

      - name: Get nanobind cmake dir
        id: nanobind
        run: |
          echo "dir=$(python -c 'import nanobind; print(nanobind.cmake_dir())')" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLEGO_MONOLITHIC_LLVM=ON \
            -DLEGO_LLVM_TARGETS="${{ contains(matrix.os, 'macos') && 'AArch64' || 'X86;NVPTX' }}" \
            -DMLIR_ENABLE_BINDINGS_PYTHON=ON \
            -DLEGO_BUILD_TESTS=ON \
            ${{ runner.os == 'Linux' && '-DLLVM_USE_LINKER=lld' || '' }} \
            -Dnanobind_DIR="${{ steps.nanobind.outputs.dir }}"

      - name: Build all targets
        run: cmake --build build -j$(getconf _NPROCESSORS_ONLN)

      - name: Tar build artifacts
        run: tar cf build-artifacts.tar build/python_packages build/tools build/test build/include

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-py${{ matrix.python }}
          path: build-artifacts.tar
          retention-days: 1
