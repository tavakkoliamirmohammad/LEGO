name: CI

on:
  push:
    branches: [test_pip_package]
  workflow_dispatch:

jobs:
  # ── Stage 1: Build ──
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
        python: ["3.12", "3.13"]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Python dependencies
        run: pip install nanobind sympy pytest

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build lld ccache

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: llvm-${{ matrix.os }}
          max-size: 2G

      - name: Get LLVM submodule commit
        id: llvm-rev
        run: |
          echo "sha=$(git submodule status third_party/llvm-project | awk '{print $1}' | tr -d '-+')" >> "$GITHUB_OUTPUT"

      - name: Cache LLVM build
        uses: actions/cache@v4
        with:
          path: build/llvm-build
          key: llvm-build-v3-${{ matrix.os }}-${{ steps.llvm-rev.outputs.sha }}
          restore-keys: |
            llvm-build-v3-${{ matrix.os }}-

      - name: Get nanobind cmake dir
        id: nanobind
        run: |
          echo "dir=$(python -c 'import nanobind; print(nanobind.cmake_dir())')" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLEGO_MONOLITHIC_LLVM=ON \
            -DLEGO_LLVM_TARGETS="${{ contains(matrix.os, 'macos') && 'AArch64' || 'X86;NVPTX' }}" \
            -DMLIR_ENABLE_BINDINGS_PYTHON=ON \
            -DLEGO_BUILD_TESTS=ON \
            ${{ runner.os == 'Linux' && '-DLLVM_USE_LINKER=lld' || '' }} \
            -Dnanobind_DIR="${{ steps.nanobind.outputs.dir }}"

      - name: Build all targets
        run: cmake --build build -j$(getconf _NPROCESSORS_ONLN)

      - name: Install lit
        run: pip install lit

      - name: Run lit tests (check-lego)
        run: cmake --build build --target check-lego

      - name: Run Python tests (check-lego-python)
        run: cmake --build build --target check-lego-python

      - name: Tar build artifacts
        run: tar cf build-artifacts.tar build/python_packages build/tools build/include

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-py${{ matrix.python }}
          path: build-artifacts.tar
          retention-days: 1

  # ── Stage 2: Package wheels (runs after build) ──
  package:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
        python: ["3.12", "3.13"]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.os }}-py${{ matrix.python }}

      - name: Extract build artifacts
        run: tar xf build-artifacts.tar

      - name: Prepare wheel package
        run: |
          cd build/python_packages/lego

          # Resolve symlinks — wheels can't contain symlinks
          find . -type l | while read link; do
            target=$(readlink -f "$link")
            rm "$link"
            cp -a "$target" "$link"
          done

          cat > pyproject.toml << 'EOF'
          [build-system]
          requires = ["setuptools>=61.0"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "lego-mlir"
          version = "0.1.0"
          description = "LEGO: Layout Expression Language for Code Generation"
          requires-python = ">=3.12"

          [tool.setuptools.packages.find]
          include = ["mlir*"]

          [tool.setuptools.package-data]
          "*" = ["*.so", "*.so.*", "*.dylib", "*.pyd", "*.h"]
          EOF

      - name: Build wheel
        run: |
          pip install build
          cd build/python_packages/lego
          python -m build --wheel --no-isolation

      - name: Verify wheel installs
        run: |
          pip install sympy
          pip install build/python_packages/lego/dist/*.whl
          python -c "from mlir.ir import Context; print('mlir.ir OK')"
          python -c "from mlir.lego.dialects.lego_dialect import register; print('lego dialect OK')"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: build/python_packages/lego/dist/*.whl
