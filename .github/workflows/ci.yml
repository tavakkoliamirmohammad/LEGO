  # ── Stage 2: Package wheels (runs after build) ──
  package:
    # needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
        python: ["3.12", "3.13"]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.os }}-py${{ matrix.python }}

      - name: Extract build artifacts
        run: tar xf build-artifacts.tar

      - name: Prepare wheel package
        run: |
          cd build/python_packages/lego
          cat > pyproject.toml << 'EOF'
          [build-system]
          requires = ["setuptools>=61.0"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "lego-mlir"
          version = "0.1.0"
          description = "LEGO: Layout Expression Language for Code Generation"
          requires-python = ">=3.12"

          [tool.setuptools.packages.find]
          include = ["mlir*"]

          [tool.setuptools.package-data]
          "*" = ["*.so", "*.so.*", "*.dylib", "*.pyd", "*.h"]
          EOF

      - name: Build wheel
        run: |
          pip install build setuptools
          cd build/python_packages/lego
          python -m build --wheel --no-isolation

      - name: Verify wheel installs
        run: |
          pip install sympy
          pip install build/python_packages/lego/dist/*.whl
          python -c "from mlir.ir import Context; print('mlir.ir OK')"
          python -c "from mlir.lego.dialects.lego_dialect import register; print('lego dialect OK')"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: build/python_packages/lego/dist/*.whl
