name: CI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # ── Cleanup old artifacts ──
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: c-hive/gha-remove-artifacts@v1
        with:
          age: '1 day'

  # ── Stage 1: Build & Test ──
  # max-parallel: 2 ensures one job per OS at a time, so py3.12 warms
  # ccache before py3.13/3.14 start on the same runner OS.
  build:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.12", container: "quay.io/pypa/manylinux_2_28_x86_64" }
          - { os: macos-15,     python: "3.12" }
          - { os: ubuntu-22.04, python: "3.13", container: "quay.io/pypa/manylinux_2_28_x86_64" }
          - { os: macos-15,     python: "3.13" }
          - { os: ubuntu-22.04, python: "3.14", container: "quay.io/pypa/manylinux_2_28_x86_64" }
          - { os: macos-15,     python: "3.14" }

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1              # shallow clone — saves ~minutes

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Install Python dependencies
        run: |
          pip install nanobind sympy pytest lit numpy
          if [ "$RUNNER_OS" = "Linux" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          else
            pip install torch
          fi

      - name: Install system dependencies (Linux / manylinux container)
        if: runner.os == 'Linux'
        run: |
          dnf install -y lld || true
          pip install ninja

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      - name: Install Rust toolchain (for naga-cli)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache naga binary
        id: cache-naga
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/naga
          key: naga-${{ runner.os }}-${{ runner.arch }}

      - name: Install naga-cli
        if: steps.cache-naga.outputs.cache-hit != 'true'
        run: cargo install naga-cli

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: llvm-${{ matrix.os }}
          max-size: 3G

      - name: Get nanobind cmake dir
        id: nanobind
        run: |
          echo "dir=$(python -c 'import nanobind; print(nanobind.cmake_dir())')" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLEGO_MONOLITHIC_LLVM=ON \
            -DLEGO_LLVM_TARGETS="${{ contains(matrix.os, 'macos') && 'AArch64;NVPTX;AMDGPU;SPIRV' || 'X86;NVPTX;AMDGPU;SPIRV' }}" \
            -DMLIR_ENABLE_BINDINGS_PYTHON=ON \
            -DLEGO_BUILD_TESTS=ON \
            ${{ runner.os == 'Linux' && '-DLLVM_USE_LINKER=lld' || '' }} \
            -Dnanobind_DIR="${{ steps.nanobind.outputs.dir }}" \
            -DLLVM_EXTERNAL_LIT="$(which lit)"

      - name: Build all targets
        run: cmake --build build -j$(getconf _NPROCESSORS_ONLN)

      - name: Run all tests (lit + pytest + imports + wheel)
        run: cmake --build build --target check-lego-all

      - name: Resolve symlinks and strip binaries
        run: |
          cd build/python_packages/lego
          # Resolve symlinks
          find . -type l | while read link; do
            target=$(python -c "import os; print(os.path.realpath('$link'))")
            if [ -e "$target" ]; then
              rm "$link"
              cp -a "$target" "$link"
            else
              rm "$link"
            fi
          done
          # Strip debug symbols from .so/.dylib — shrinks wheel significantly
          if [ "$RUNNER_OS" = "Linux" ]; then
            find . -name '*.so' -o -name '*.so.*' | xargs strip --strip-unneeded 2>/dev/null || true
          else
            find . -name '*.dylib' -o -name '*.so' | xargs strip -x 2>/dev/null || true
          fi

      - name: Prepare wheel
        run: cmake --build build --target lego-prepare-wheel

      - name: Bundle naga into wheel
        run: |
          mkdir -p build/python_packages/lego/lego/bin
          NAGA_BIN=$(which naga || echo "$HOME/.cargo/bin/naga")
          if [ -f "$NAGA_BIN" ]; then
            cp "$NAGA_BIN" build/python_packages/lego/lego/bin/
            chmod +x build/python_packages/lego/lego/bin/naga
            echo "Bundled naga: $(du -h build/python_packages/lego/lego/bin/naga | cut -f1)"
          else
            echo "WARNING: naga binary not found, wheel will not include naga"
          fi

      - name: Tar build artifacts
        run: tar czf build-artifacts.tar.gz build/python_packages

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-py${{ matrix.python }}
          path: build-artifacts.tar.gz
          retention-days: 1

  # ── WASM Viz Build ──
  # Builds the browser-side LEGO compiler (lego_driver.wasm).
  # Artifacts can be deployed to GitHub Pages.
  wasm-viz:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build lld ccache

      - name: Set up ccache (native)
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: wasm-native
          max-size: 2G

      - name: Build native tblgen tools
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLEGO_MONOLITHIC_LLVM=ON \
            -DLEGO_LLVM_TARGETS="X86" \
            -DLLVM_USE_LINKER=lld \
            -DLEGO_BUILD_TESTS=OFF \
            -DMLIR_ENABLE_BINDINGS_PYTHON=OFF
          cmake --build build --target mlir-tblgen llvm-tblgen llvm-min-tblgen -j$(nproc)

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Set up ccache (wasm)
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: wasm-emscripten
          max-size: 2G

      - name: Configure WASM build
        run: |
          emcmake cmake -B build-wasm -G Ninja \
            -DLEGO_MONOLITHIC_LLVM=ON \
            -DLLVM_NATIVE_TOOL_DIR=$PWD/build/llvm-build/bin \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLEGO_BUILD_TESTS=OFF \
            -Wno-dev

      - name: Build WASM driver
        run: cmake --build build-wasm --target lego_driver -j$(nproc)

      - name: Verify output
        run: |
          ls -lh viz/wasm/lego_driver.js viz/wasm/lego_driver.wasm
          echo "WASM size: $(du -h viz/wasm/lego_driver.wasm | cut -f1)"

      - name: Upload viz site
        uses: actions/upload-artifact@v4
        with:
          name: lego-studio
          path: |
            viz/index.html
            viz/css/
            viz/js/
            viz/wasm/lego_driver.js
            viz/wasm/lego_driver.wasm
          retention-days: 30

  # ── Deploy LEGO Studio to GitHub Pages ──
  deploy-pages:
    needs: wasm-viz
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download viz artifact
        uses: actions/download-artifact@v4
        with:
          name: lego-studio
          path: site

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

  # ── Stage 2: Package wheels (runs after build) ──
  package:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
        python: ["3.12", "3.13", "3.14"]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.os }}-py${{ matrix.python }}

      - name: Extract build artifacts
        run: tar xzf build-artifacts.tar.gz

      - name: Build wheel
        run: |
          pip install wheel setuptools build
          cd build/python_packages/lego
          rm -rf dist build
          pip wheel . --no-deps --use-pep517 -w dist
          if [ "$RUNNER_OS" = "Linux" ]; then
            pip install auditwheel
            for whl in dist/*.whl; do
              auditwheel repair "$whl" --plat manylinux_2_28_x86_64 -w dist/
              rm "$whl"
            done
          fi
          ls -lh dist/

      - name: Verify wheel installs
        run: |
          pip install --force-reinstall --no-deps --no-index --find-links build/python_packages/lego/dist lego-layout
          python -P python/check_imports.py

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: build/python_packages/lego/dist/*.whl

  # ── Stage 3: Publish to PyPI (only on version tags) ──
  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/

      - name: List wheels
        run: ls -lh dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
