name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # ── Cleanup old artifacts ──
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: c-hive/gha-remove-artifacts@v1
        with:
          age: '1 day'

  # ── Stage 1: Build & Test ──
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
        python: ["3.12", "3.13", "3.14"]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1              # shallow clone — saves ~minutes

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Install Python dependencies
        run: |
          pip install nanobind sympy pytest lit numpy
          if [ "$RUNNER_OS" = "Linux" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          else
            pip install torch
          fi

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build lld ccache

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: llvm-${{ matrix.os }}
          max-size: 2G

      - name: Get nanobind cmake dir
        id: nanobind
        run: |
          echo "dir=$(python -c 'import nanobind; print(nanobind.cmake_dir())')" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLEGO_MONOLITHIC_LLVM=ON \
            -DLEGO_LLVM_TARGETS="${{ contains(matrix.os, 'macos') && 'AArch64' || 'X86;NVPTX' }}" \
            -DMLIR_ENABLE_BINDINGS_PYTHON=ON \
            -DLEGO_BUILD_TESTS=ON \
            ${{ runner.os == 'Linux' && '-DLLVM_USE_LINKER=lld' || '' }} \
            -Dnanobind_DIR="${{ steps.nanobind.outputs.dir }}" \
            -DLLVM_EXTERNAL_LIT="$(which lit)"

      - name: Build all targets
        run: cmake --build build -j$(getconf _NPROCESSORS_ONLN)

      - name: Run lit tests (check-lego)
        run: cmake --build build --target check-lego

      - name: Run Python tests (check-lego-python)
        run: cmake --build build --target check-lego-python

      - name: Resolve symlinks and strip binaries
        run: |
          cd build/python_packages/lego
          # Resolve symlinks
          find . -type l | while read link; do
            target=$(python -c "import os; print(os.path.realpath('$link'))")
            if [ -e "$target" ]; then
              rm "$link"
              cp -a "$target" "$link"
            else
              rm "$link"
            fi
          done
          # Strip debug symbols from .so/.dylib — shrinks wheel significantly
          if [ "$RUNNER_OS" = "Linux" ]; then
            find . -name '*.so' -o -name '*.so.*' | xargs strip --strip-unneeded 2>/dev/null || true
          else
            find . -name '*.dylib' -o -name '*.so' | xargs strip -x 2>/dev/null || true
          fi

      - name: Tar build artifacts
        run: tar czf build-artifacts.tar.gz build/python_packages

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-py${{ matrix.python }}
          path: build-artifacts.tar.gz
          retention-days: 1

  # ── Stage 2: Package wheels (runs after build) ──
  package:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
        python: ["3.12", "3.13", "3.14"]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.os }}-py${{ matrix.python }}

      - name: Extract build artifacts
        run: tar xzf build-artifacts.tar.gz

      - name: Build wheel
        run: |
          pip install wheel setuptools
          cd build/python_packages/lego

          cat > setup.py << 'SETUP'
          from setuptools import setup, find_packages
          setup(
              name="lego-layout",
              version="0.1.0",
              description="LEGO: Layout Expression Language for Code Generation",
              python_requires=">=3.12",
              packages=find_packages(include=["mlir*"]),
              package_data={"": ["*.so", "*.so.*", "*.dylib", "*.pyd", "*.h"]},
              has_ext_modules=lambda: True,  # forces platform-specific wheel tag
          )
          SETUP

          python setup.py bdist_wheel
          ls -lh dist/

      - name: Verify wheel installs
        run: |
          pip install sympy
          pip install build/python_packages/lego/dist/*.whl
          python -c "
          from mlir.ir import Context, Module, Location
          from mlir.lego.dialects.lego_dialect import register
          with Context() as ctx:
              register(ctx)
              loc = Location.unknown(ctx)
              m = Module.create(loc)
              print('Context + dialect registration OK')
          "
          python -c "
          from mlir.dialects import arith, func, scf, memref
          print('Standard dialects OK')
          "
          python -c "
          from mlir.passmanager import PassManager
          print('PassManager OK')
          "

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: build/python_packages/lego/dist/*.whl

  # ── Stage 3: Publish to PyPI (only on version tags) ──
  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
